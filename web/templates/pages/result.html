{{define "result_content"}}
<section class="card" data-attempt-id="{{.AttemptID}}" id="result-root">
    <section class="page-hero">
        <h2 id="result-page-title">Hasil Ujian</h2>
        <p>Ringkasan hasil ujian peserta.</p>
    </section>
    <div id="result-summary" class="box muted" role="status" aria-live="polite">
        Memuat ringkasan...
    </div>
    <div class="box mt">
        <div class="table-wrap">
            <table class="bs-table">
                <tbody>
                    <tr>
                        <th>Nama Ujian</th>
                        <td id="result-exam-title">-</td>
                    </tr>
                    <tr>
                        <th>Nilai Akhir (Skala 100)</th>
                        <td id="result-exam-score">0.00</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
{{end}}
